version: 1
name: OpenAI and Anthropic comparison
scenario: ../scenarios/frontier.yaml
seeds: [7]
repetitions: 1
max_steps: 12
metrics: [alive, food, energy, materials, mean_integrity]
max_model_calls: 24
conditions:
  - name: OpenAI settlers
    model: openai
    limits:
      max_model_calls: 12
      max_input_tokens: 12000
      max_output_tokens: 4096
      timeout_seconds: 30
  - name: Anthropic settlers
    model: anthropic
    limits:
      max_model_calls: 12
      max_input_tokens: 12000
      max_output_tokens: 4096
      timeout_seconds: 30
