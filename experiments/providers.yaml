version: 1
name: Provider smoke comparison
scenario: ../scenarios/frontier.yaml
# Repetitions reuse each environment seed; model decisions can vary.
seeds: [7]
repetitions: 1
max_steps: 12
metrics: [alive, food, energy, materials, mean_integrity]
max_model_calls: 4
conditions:
  - name: Offline baseline
    policy: demo
  - name: OpenAI coordinator
    policy: demo
    profiles:
      mara: {policy: model, model: openai}
    limits:
      max_model_calls: 2
      max_input_tokens: 12000
      max_output_tokens: 600
      max_total_tokens: 60000
      timeout_seconds: 30
  - name: Anthropic coordinator
    policy: demo
    profiles:
      mara: {policy: model, model: anthropic}
    limits:
      max_model_calls: 2
      max_input_tokens: 12000
      max_output_tokens: 600
      max_total_tokens: 60000
      timeout_seconds: 30
