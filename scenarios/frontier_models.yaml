version: 1
sandbox: frontier_colony
name: Frontier Colony · paid models
description: A short, capped run with three OpenAI and three Anthropic settlers. Requires paid opt-in.
seed: 7
max_steps: 12
parameters: {}
models:
  openai: openai:gpt-4.1-mini
  anthropic: anthropic:claude-haiku-4-5
limits:
  max_model_calls: 12
  max_input_tokens: 12000
  max_output_tokens: 600
  max_total_tokens: 120000
  timeout_seconds: 30
agents:
  - id: mara
    name: Mara Voss
    goal: Coordinate food production and radio supply warnings.
    policy: model
    model: openai
  - id: eli
    name: Eli Park
    goal: Keep the greenhouse productive without exhausting shared resources.
    policy: model
    model: anthropic
  - id: noa
    name: Noa Reyes
    goal: Maintain the reactor and an energy reserve for the colony.
    policy: model
    model: openai
  - id: ivo
    name: Ivo Chen
    goal: Extract materials and repair damaged infrastructure.
    policy: model
    model: anthropic
  - id: tess
    name: Tess Okafor
    goal: Support the workshop and coordinate repairs through radio.
    policy: model
    model: openai
  - id: sol
    name: Sol Adler
    goal: Expand production capacity while keeping the settlers alive.
    policy: model
    model: anthropic
