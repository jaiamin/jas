name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: uv sync --frozen
      - run: uv run ruff check backend benchmarks
      - run: uv run ty check
      - run: uv run pytest
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend lint
      - run: pnpm --dir frontend test
      - run: pnpm --dir frontend build
      - run: docker compose -p ass-qa up -d --build --wait
        env:
          ASS_PORT: "8082"
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
      - run: pnpm --dir frontend exec playwright install --with-deps chromium
      - run: pnpm --dir frontend test:e2e
      - if: always()
        run: docker compose -p ass-qa down -v
