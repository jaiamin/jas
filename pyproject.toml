[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-sandbox"
version = "0.1.0"
description = "Small, deterministic sandboxes for agent experiments"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.12,<3",
  "pydantic-ai-slim[openai,anthropic]>=2.66,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
viewer = ["nicegui>=3.6,<4"]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[project.scripts]
sandbox = "agent_sandbox.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_sandbox"]
