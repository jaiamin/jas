[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-simulation-environment"
version = "0.2.0"
description = "JAS: an empirical workspace for agent experiments"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.135,<1",
  "uvicorn[standard]>=0.42,<1",
  "sqlalchemy>=2.0.48,<3",
  "pydantic>=2.12,<3",
  "pydantic-ai-slim[openai,anthropic]>=2.66,<3",
  "python-dotenv>=1.2,<2",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "httpx>=0.28,<1",
    "ruff>=0.15,<1",
    "ty>=0.0.24,<1",
]

[project.scripts]
jas = "agent_sim.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/agent_sim"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ty.environment]
root = ["backend/src", "."]

[tool.ty.src]
include = ["backend"]
